name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — no value in testing a commit
# that has already been pushed past.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Facilitator + tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r facilitator/requirements.txt
          pip install -r demo-agent/requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check facilitator demo-agent reporting tests

      # No services running here, so the integration tests skip. They are run
      # for real in the smoke job below, where a skip is made fatal.
      - name: Unit and service tests
        run: pytest tests -v

  postgres:
    name: Facilitator + tests (Postgres)
    runs-on: ubuntu-latest
    # The actual proof that facilitator/db.py's dialect shim didn't quietly
    # break the money-handling code it sits in front of: every test that
    # touches the ledger (via the `ledger`, `client`, and `facilitator_app`
    # fixtures) runs unmodified against a real Postgres instead of SQLite.
    # TestIntegration and TestDemoApi skip here — no live services are
    # started in this job, which is correct, since those tests exercise the
    # Node<->Python HTTP contract, not the database engine.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bharatx402
          POSTGRES_PASSWORD: bharatx402
          POSTGRES_DB: bharatx402_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_LEDGER_DSN: postgresql://bharatx402:bharatx402@localhost:5432/bharatx402_test
      # Belt and braces: the ledger_path fixture already creates the schema
      # itself before every test (the container starts genuinely empty), but
      # this documents the intent for anyone who later points a live
      # facilitator process at this same database outside of pytest.
      LEDGER_AUTO_MIGRATE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r facilitator/requirements.txt
          pip install pytest

      - name: Full test suite against real Postgres
        run: pytest tests -v

  node:
    name: Resource server (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: resource-server/package-lock.json

      - name: Install dependencies
        working-directory: resource-server
        run: npm ci

      - name: Syntax check
        working-directory: resource-server
        run: |
          node --check server.js
          node --check x402-config.js

  smoke:
    name: End-to-end 402 smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: resource-server/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r facilitator/requirements.txt -r demo-agent/requirements.txt
          pip install pytest
          npm --prefix resource-server ci

      # No secrets in CI: MOCK_RAZORPAY keeps the facilitator from making any
      # outbound API call, so the full flow runs without a Razorpay account.
      - name: Configure services
        run: |
          cp facilitator/.env.example facilitator/.env
          cp resource-server/.env.example resource-server/.env
          cp demo-agent/.env.example demo-agent/.env

      # ENABLE_DEMO_API turns on the console's server-side agent runner
      # (facilitator/demo_trace.py), exercised by the integration tests below.
      - name: Start facilitator
        env:
          ENABLE_DEMO_API: "1"
          RESOURCE_URL: "http://localhost:3402"
        run: |
          cd facilitator
          nohup python -m uvicorn main:app --port 8402 > /tmp/facilitator.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8402/health && break
            sleep 1
          done
          curl -sf http://localhost:8402/supported | tee /dev/stderr | grep -q 'razorpay-inr'

      - name: Start resource server
        run: |
          cd resource-server
          nohup node server.js > /tmp/resource-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3402/health && break
            sleep 1
          done

      # The core assertion of the whole project: an unpaid agent request is
      # answered with a spec-shaped 402 denominated in paise, pointing at an
      # INR facilitator rather than an EVM one.
      - name: Unpaid request returns a 402 with an INR offer
        run: |
          status=$(curl -s -o /tmp/402.json -D /tmp/402.headers -w '%{http_code}' \
            http://localhost:3402/premium/market-report)
          echo "status=$status"
          test "$status" = "402"

          offer=$(grep -i '^payment-required:' /tmp/402.headers | cut -d' ' -f2- | tr -d '\r' | base64 -d)
          echo "$offer" | python -m json.tool

          echo "$offer" | python -c '
          import json, sys
          required = json.load(sys.stdin)
          assert required["x402Version"] == 2, required
          accepts = required["accepts"]
          assert len(accepts) == 1, accepts
          offer = accepts[0]
          assert offer["scheme"] == "razorpay-inr", offer
          assert offer["network"] == "razorpay:inr-test", offer
          assert offer["asset"] == "INR", offer
          assert offer["amount"] == "500", offer  # paise, not rupees
          print("402 offer OK:", offer["extra"]["humanAmount"])
          '

      - name: Free route stays free
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:3402/free/market-report-preview)
          test "$status" = "200"

      # The console is what a reviewer actually sees, so it gets its own
      # smoke check: the page loads, the two API endpoints it depends on
      # answer, and the micro-priced route it needs for the economics card
      # exists at a price under the gateway minimum.
      - name: Console UI is served and its endpoints answer
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3402/)
          test "$status" = "200"
          curl -sf http://localhost:3402/ | grep -qi '<title>Bharat x402'

          curl -sf http://localhost:3402/api/resources | tee /dev/stderr \
            | grep -q '"key":"api-call"'

          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3402/premium/api-call)
          test "$status" = "402"

          # The verify-it-yourself card. Its absence would not break any other
          # check, so it gets its own.
          curl -sf http://localhost:3402/ | grep -q 'id="card-verify"'

      # The console lets a visitor verify a commitment signature in their own
      # browser, using WebCrypto against the public key from /agents/<id>.
      # That depends on three things the demo API has no other reason to
      # emit — canonicalJson, signature, agentPublicKey — so a refactor could
      # silently leave the button verifying nothing.
      #
      # This reproduces the browser's check in Python: same key source, same
      # bytes, same primitive, plus the tamper case the UI demonstrates.
      - name: Console's signature-verification demo actually verifies
        run: |
          curl -sf -X POST http://localhost:8402/demo/run \
            -H 'Content-Type: application/json' \
            -d '{"sessionId":"ci-verify-session","agentLabel":"ci-bot","resource":"market-report"}' \
            -o /tmp/verify_run.json
          python -c '
          import base64, json, re, urllib.request
          from cryptography.exceptions import InvalidSignature
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          run = json.load(open("/tmp/verify_run.json", encoding="utf-8"))
          assert run["ok"] is True, run
          step = next(s for s in run["steps"] if s["n"] == 3)
          decoded = step["decoded"]
          for field in ("canonicalJson", "signature", "agentPublicKey"):
              assert decoded.get(field), f"demo/run step 3 lost {field} — the console verifier needs it"

          # The key must come from the public registry, not from the response
          # being checked: verifying against a key supplied by the same
          # payload would prove nothing.
          url = "http://localhost:8402/agents/" + run["agentId"]
          registered = json.load(urllib.request.urlopen(url))["publicKey"]
          assert registered == decoded["agentPublicKey"], "registry key != key in trace"

          key = Ed25519PublicKey.from_public_bytes(base64.b64decode(registered))
          sig = base64.b64decode(decoded["signature"])
          key.verify(sig, decoded["canonicalJson"].encode())
          print("signature verifies against the registered public key")

          tampered = re.sub(r"\"amountPaise\":\d+", "\"amountPaise\":1", decoded["canonicalJson"])
          assert tampered != decoded["canonicalJson"], "tamper produced identical bytes"
          try:
              key.verify(sig, tampered.encode())
          except InvalidSignature:
              print("rewriting the amount correctly invalidates the signature")
          else:
              raise AssertionError("a rewritten amount still verified — non-repudiation is broken")
          '

      # POST /demo/run is the console's server-side agent runner — this is
      # what a click of "Fetch as AI agent" actually calls.
      - name: Console's demo API completes a negotiation
        run: |
          curl -sf -X POST http://localhost:8402/demo/run \
            -H 'Content-Type: application/json' \
            -d '{"sessionId":"ci-smoke-session","agentLabel":"ci-bot","resource":"market-report"}' \
            -o /tmp/demo_run.json
          python -c '
          import json
          d = json.load(open("/tmp/demo_run.json", encoding="utf-8"))
          assert d["ok"] is True, d
          assert d["receipt"]["transaction"].startswith("cmt_"), d
          assert "dev-only-shared-secret" not in json.dumps(d)
          print("demo/run OK:", d["agentId"], d["receipt"]["transaction"])
          '

      # The full suite against live services. REQUIRE_INTEGRATION turns an
      # unreachable service into a failure instead of a skip — a suite that
      # quietly stops testing the thing it exists to test is worse than none.
      - name: Full test suite against live services
        env:
          REQUIRE_INTEGRATION: "1"
        run: pytest tests -v

      # The whole point, asserted end to end: quote an offer, sign acceptance,
      # present it, get the content and a settlement receipt back.
      - name: Paid request unlocks the resource
        run: python tests/ci_paid_flow.py

      # Batching is the project's actual contribution, so CI checks the money
      # reconciles rather than trusting the endpoint returned 200.
      - name: Batch settlement reconciles against the ledger
        run: python tests/ci_batch_flow.py

      # The demo agent is what a reviewer runs first, so a broken one is worse
      # than a broken internal. NO_COLOR keeps the log readable.
      - name: Demo agent completes the negotiation
        env:
          NO_COLOR: "1"
        run: |
          python demo-agent/crawler_agent.py
          python demo-agent/crawler_agent.py --count 5 --agent-id agent-ci-crawler

      # The scheduler must be safe to run more often than needed: a second run
      # with nothing pending has to be a no-op, or it will eventually
      # double-charge someone.
      - name: Scheduler settles, then no-ops
        run: |
          python facilitator/scheduler.py --once --dry-run
          python facilitator/scheduler.py --once | tee /tmp/settle.json
          grep -q '"event": "settlement_run"' /tmp/settle.json

          python facilitator/scheduler.py --once | tee /tmp/settle2.json
          grep -q '"event": "settlement_noop"' /tmp/settle2.json

      # A revenue report that overstates is worse than no report, so this
      # checks the money agrees with itself rather than that the script ran.
      - name: Publisher digest reconciles
        env:
          LEDGER_DB_PATH: facilitator/data/ledger.db
        run: python tests/ci_digest.py

      - name: Dump service logs
        if: always()
        run: |
          echo "--- facilitator ---"; cat /tmp/facilitator.log || true
          echo "--- resource server ---"; cat /tmp/resource-server.log || true
